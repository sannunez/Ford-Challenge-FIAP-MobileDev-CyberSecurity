spring.application.name=ChallengeFord
server.port=${PORT:8080}

# Suprime o log "Using generated security password" — autenticação é feita exclusivamente via JWT
logging.level.org.springframework.boot.autoconfigure.security=WARN

# Formato de log estruturado: timestamp + nível + logger + mensagem — sem dados sensíveis no padrão
logging.level.com.example.ChallengeFord=INFO
logging.level.AUDIT=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level [%X{cid:---------}] [%thread] %logger{36} - %msg%n

# Suprime os detalhes da página /error padrão do Spring Boot para evitar vazar informações do framework
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-exception=false

# JWT — gerar secret seguro em produção com: openssl rand -base64 32
# O secret deve ter ao menos 32 caracteres (256 bits para HMAC-SHA256)
jwt.secret=${JWT_SECRET:local-development-secret-change-before-deploying}
jwt.expiration=${JWT_EXPIRATION:3600000}
jwt.app-key=${JWT_APP_KEY:ford-challenge-development-key}

# Browser origins are configurable for local Docker and future hosted frontends.
app.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:http://10.0.2.2:*,http://localhost:*,http://127.0.0.1:*}
