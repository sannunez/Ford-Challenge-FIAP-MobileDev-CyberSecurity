services:
  backend:
    build:
      context: ./ChallengeFord
      dockerfile: Dockerfile
    environment:
      PORT: ${PORT:-8080}
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET in the root .env file}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-3600000}
      JWT_APP_KEY: ${JWT_APP_KEY:?Define JWT_APP_KEY in the root .env file}
      CORS_ALLOWED_ORIGIN_PATTERNS: ${CORS_ALLOWED_ORIGIN_PATTERNS:-http://10.0.2.2:*,http://localhost:*,http://127.0.0.1:*}
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    restart: unless-stopped

  mobile:
    build:
      context: ./Challenge-App
      dockerfile: Dockerfile
      target: development
    depends_on:
      - backend
    environment:
      EXPO_PUBLIC_API_URL: ${EXPO_PUBLIC_API_URL:-http://10.0.2.2:8080}
      EXPO_PUBLIC_APP_KEY: ${EXPO_PUBLIC_APP_KEY:?Define EXPO_PUBLIC_APP_KEY in the root .env file}
      REACT_NATIVE_PACKAGER_HOSTNAME: ${EXPO_HOST_IP:-10.0.2.2}
    ports:
      - "8081:8081"
    volumes:
      - ./Challenge-App:/app
      - mobile_node_modules:/app/node_modules
    stdin_open: true
    tty: true

volumes:
  mobile_node_modules:

